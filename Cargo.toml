[package]
name = "xpt2046-async"
version = "0.3.3"
edition = "2021"
description = "Embedded-hal based XPT2046 driver for TFT LCD displays"
categories = ["embedded", "hardware-support", "no-std"]
authors = ["VersBInarii <versbinarii@gmail.com>", "Vladislav Sukhmel <sukhmel.v@gmail.com>"]
keywords = ["embedded-hal-driver", "xpt2046", "touch", "no_std", "async"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sukhmel/xpt2046_async"
exclude = ["*.png"]

[lib]
name = "xpt2046_async"

[dependencies]
embedded-hal-async = "=1.0.0"
embedded-hal = "=1.0.0"
embedded-graphics-core = "0.4.0"
embedded-graphics = { version = "0.8.2", optional = true }

[features]
default = []
calibration = ["embedded-graphics"]